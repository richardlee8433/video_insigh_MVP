[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/analyze"
  to = "https://video-insigh-mvp.onrender.com/analyze"
  status = 200
  force = true

[[redirects]]
  from = "/status/*"
  to = "https://video-insigh-mvp.onrender.com/status/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/audit/*"
  to = "https://video-insigh-mvp.onrender.com/audit/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
